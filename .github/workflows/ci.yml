name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Build-time placeholders. The Supabase client is only called at request
      # time, so these are never used during `next build`.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  db:
    name: db (migrations + tests SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Version épinglée : la suite a été validée avec celle-ci. `latest`
          # ferait dépendre le vert de la CI d'une release amont non relue.
          version: 2.109.1

      # Postgres seul (pas la stack complète) : les tests parlent à la base,
      # pas à PostgREST ni à GoTrue. Docker est préinstallé sur ubuntu-latest.
      - name: Démarrer Postgres
        run: supabase db start

      # `db reset` rejoue la chaîne ENTIÈRE depuis 001 + seed.sql. C'est le
      # point du job : une migration qui ne s'applique que sur une base déjà
      # à jour, ou qui casse la chaîne pour un nouveau dev, échoue ici.
      - name: Appliquer toute la chaîne de migrations
        run: supabase db reset --local

      # Même script qu'en local : deux copies divergeraient.
      - name: Rejouer la suite SQL
        run: ./supabase/tests/run-all.sh

      # Nom du conteneur découvert, jamais codé en dur : il dérive du
      # project_id de supabase/config.toml et changerait avec lui.
      - name: Journaux Postgres en cas d'échec
        if: failure()
        run: |
          docker logs "$(docker ps -a --filter 'name=supabase_db_' \
            --format '{{.Names}}' | head -1)" --tail 100

  e2e:
    name: e2e (parcours authentifiés)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - run: bun install --frozen-lockfile
        working-directory: apps/web

      # Chromium seul : les specs ne ciblent qu'un moteur, installer les trois
      # tripleraient le temps de préparation pour rien.
      - name: Installer Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # Pile RÉDUITE au strict nécessaire : base, auth, PostgREST, passerelle.
      # Studio, realtime, storage, imgproxy, analytics, edge-runtime ne sont
      # jamais sollicités par les specs — les démarrer ne ferait qu'allonger le
      # job. Validé en local : 20/20 sur ce sous-ensemble.
      # `supabase start` applique aussi migrations + seed.sql, donc les trois
      # bailleurs de test existent d'emblée.
      - name: Démarrer la pile Supabase (réduite)
        run: |
          supabase start \
            -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector

      # Identifiants DÉRIVÉS du stack qui vient de démarrer, jamais figés : les
      # valeurs par défaut de playwright.config sont pratiques en local mais
      # peuvent changer d'une version de CLI à l'autre. Ici on lit la vérité.
      - name: Exporter les identifiants du stack local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Rejouer les parcours
        run: bun run test:e2e
        working-directory: apps/web

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Journaux des services en cas d'échec
        if: failure()
        run: |
          for c in $(docker ps -a --filter 'name=supabase_' --format '{{.Names}}'); do
            echo "===== $c"
            docker logs "$c" --tail 40 2>&1 || true
          done

  sql:
    name: sql (migrations + tests)
    runs-on: ubuntu-latest

    # Postgres 16 : même version majeure que Supabase.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Client psql
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      # pg_cron n'existe pas dans l'image postgres officielle, et la migration
      # 011 en dépend en dur (create extension + cron.schedule). On installe un
      # substitut minimal : une table cron.job et les deux fonctions appelées.
      # Il est écrit DANS le conteneur de service, seul endroit où PostgreSQL
      # lit les fichiers d'extension ; un volume ne conviendrait pas, les
      # services démarrent avant le checkout.
      - name: Substitut pg_cron
        run: |
          set -euo pipefail
          CID=$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then echo "conteneur postgres introuvable"; exit 1; fi

          docker exec -u root -i "$CID" bash -c 'cat > /usr/share/postgresql/16/extension/pg_cron.control' <<'CONTROL'
          comment = 'pg_cron shim'
          default_version = '1.6'
          relocatable = false
          schema = pg_catalog
          CONTROL

          docker exec -u root -i "$CID" bash -c 'cat > /usr/share/postgresql/16/extension/pg_cron--1.6.sql' <<'EXT'
          create schema if not exists cron;
          create sequence cron.jobid_seq;
          create table cron.job (
            jobid bigint primary key default nextval('cron.jobid_seq'),
            jobname text unique,
            schedule text not null,
            command text not null
          );
          create function cron.schedule(job_name text, schedule text, command text)
          returns bigint language plpgsql as $fn$
          declare v_id bigint;
          begin
            insert into cron.job (jobname, schedule, command)
            values (job_name, schedule, command)
            on conflict (jobname) do update
              set schedule = excluded.schedule, command = excluded.command
            returning jobid into v_id;
            return v_id;
          end $fn$;
          create function cron.unschedule(job_name text)
          returns boolean language sql as $fn$
            delete from cron.job where jobname = job_name returning true;
          $fn$;
          EXT

      # Rôles Supabase et schéma auth : les migrations les supposent présents
      # (grants, policies, auth.uid()). Ils sont fournis par la plateforme en
      # production, jamais par une migration du dépôt.
      - name: Substituts Supabase (rôles, schéma auth)
        run: |
          set -euo pipefail
          psql -d postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create role supabase_admin nologin superuser;
          create database ranti_test;
          SQL

          psql -d ranti_test -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema auth;
          create table auth.users (
            id uuid primary key,
            instance_id uuid,
            aud text,
            role text,
            email text,
            created_at timestamptz not null default now()
          );
          -- Définition Supabase : le sub du JWT, quelle que soit la forme sous
          -- laquelle PostgREST l'a posé.
          create function auth.uid() returns uuid language sql stable as $$
            select coalesce(
              nullif(current_setting('request.jwt.claim.sub', true), ''),
              nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub'
            )::uuid
          $$;
          grant usage on schema auth to anon, authenticated, service_role;
          grant select on auth.users to anon, authenticated, service_role;
          SQL

      - name: Migrations
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations | sort); do
            echo "--- $f"
            psql -d ranti_test -v ON_ERROR_STOP=1 -q -f "supabase/migrations/$f"
          done

      # Chaque test est un script `begin; ... rollback;` qui lève une exception
      # sur la moindre assertion fausse : ON_ERROR_STOP=1 suffit à faire
      # échouer l'étape, donc le job.
      - name: Tests SQL
        run: |
          set -euo pipefail
          for f in $(ls supabase/tests/*.sql | sort); do
            echo "--- $f"
            psql -d ranti_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
